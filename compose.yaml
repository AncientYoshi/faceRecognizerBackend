services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_attendance
      POSTGRES_USER: smart_attendance
      POSTGRES_PASSWORD: smart_attendance
    ports:
      - "5432:5432"
    volumes:
      - smart-attendance-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_attendance -d smart_attendance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smart-attendance-postgres:
