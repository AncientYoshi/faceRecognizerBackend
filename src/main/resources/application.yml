spring:
  application:
    name: smart-attendance-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smart_attendance}
    username: ${DB_USERNAME:smart_attendance}
    password: ${DB_PASSWORD:smart_attendance}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:true}
            required: ${MAIL_STARTTLS_REQUIRED:true}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_TIMEOUT:10000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:10000}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  time-zone: ${APP_TIME_ZONE:Asia/Yangon}
  security:
    jwt:
      issuer: ${JWT_ISSUER:smart-attendance-backend}
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TTL:1d}
      refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME:System}
      last-name: ${BOOTSTRAP_ADMIN_LAST_NAME:Administrator}
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    connect-timeout: ${AI_CONNECT_TIMEOUT:3s}
    read-timeout: ${AI_READ_TIMEOUT:30s}
  hardware:
    device-id: ${HARDWARE_DEVICE_ID:CLASSROOM-01}
    device-key: ${HARDWARE_DEVICE_KEY:change-this-device-secret}
  photo-upload-test:
    enabled: ${PHOTO_UPLOAD_TEST_ENABLED:false}
    directory: ${PHOTO_UPLOAD_TEST_DIRECTORY:/tmp/smart-attendance-upload-test}
    max-bytes: ${PHOTO_UPLOAD_TEST_MAX_BYTES:5242880}
  attendance:
    automation:
      enabled: ${ATTENDANCE_AUTOMATION_ENABLED:true}
      interval: ${ATTENDANCE_AUTOMATION_INTERVAL:30s}
      initial-delay: ${ATTENDANCE_AUTOMATION_INITIAL_DELAY:10s}
  notifications:
    mail:
      enabled: ${MAIL_NOTIFICATIONS_ENABLED:false}
      from: ${MAIL_FROM:${MAIL_USERNAME:}}
      frontend-base-url: ${FRONTEND_BASE_URL:https://tuhmbattendance.com}

logging:
  level:
    root: INFO
    com.tuhmb.smartattendancebackend: INFO
