spring:
  datasource:
    url: jdbc:h2:mem:smart_attendance;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  security:
    jwt:
      issuer: smart-attendance-test
      secret: test-secret-key-with-at-least-thirty-two-bytes-long
      access-token-ttl: 15m
      refresh-token-ttl: 7d
  bootstrap:
    admin:
      enabled: false
